<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Đề Kiểm Tra</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #6c757d;
            --secondary-hover: #5a6268;
            --light-bg: #f0f2f5;
            --white-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --border-radius: 8px; 
        }
        body { 
            font-family: -apple-system, BlinkMacMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--light-bg); 
            margin: 0; 
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 30px;
            background: var(--white-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        /* Nút chung */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-decoration: none;
            color: var(--white-bg);
            transition: background-color 0.2s;
        }
        .btn svg { width: 16px; height: 16px; fill: currentColor; }
        .btn-secondary { background-color: var(--secondary-color); }
        .btn-secondary:hover { background-color: var(--secondary-hover); }

        /* Header trang */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .page-header h1 { margin: 0; color: #333; }
        
        .welcome {
            font-size: 1.1em;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        /* Danh sách đề thi */
        #test-list {
            margin-top: 20px;
        }
        .test-item {
            display: block; 
            width: 100%;
            margin-bottom: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: left;
            transition: background-color 0.2s, transform 0.2s;
            box-sizing: border-box;
            position: relative; 
            
            padding: 0; 
            /* Bổ sung overflow: hidden để lớp phủ không bị tràn ra ngoài viền bo tròn */
            overflow: hidden;
        }
        
        /* Div nội dung để giữ padding và flex */
        .test-item-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px; 
            width: 100%;
            height: 100%;
            box-sizing: border-box; 
        }

        .test-item:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px);
        }
        .test-item.disabled { 
            background-color: #adb5bd;
            cursor: not-allowed;
            opacity: 1; /* Đảm bảo opacity là 1 để nền đen rõ nét */
            transform: none;
        }
        
        /* --- CSS SỬA LỖI CHÍNH: TẬP TRUNG HIỂN THỊ OVERLAY GỌN GÀNG HƠN --- */
        .test-item .overlay-status {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Màu nền bôi đen full */
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 8px; 
            
            /* Dùng Flexbox để căn giữa */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            
            flex-direction: column; 
            padding: 10px;
            box-sizing: border-box; /* Quan trọng: Đảm bảo padding không làm tràn lớp phủ */
        }
        
        .full-status-text {
            /* Giới hạn chiều rộng để không đè lên lề */
            max-width: 90%; 
            display: block;
            padding: 8px 15px;
            border-radius: 8px;
            
            /* Tinh chỉnh font chữ */
            font-size: 1em; 
            font-weight: 600; 
            color: #ffc107; /* Màu vàng cam nổi bật */
            
            /* Để thông báo nằm gọn trong 1 dòng (trừ khi quá dài) */
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            
            /* Đảm bảo không bị dính vào viền nút */
            margin: 0; 
            background-color: transparent; /* Loại bỏ nền trắng mờ */
        }

        /* NEW: Khi thông báo quá dài, cho phép xuống dòng và căn giữa */
        @media (max-width: 400px) {
            .full-status-text {
                white-space: normal;
                word-break: break-word;
                font-size: 0.9em;
                max-width: 95%; 
            }
        }
        
        /* Loại bỏ nền cho các trạng thái */
        .test-item.disabled .full-status-text,
        .test-item.closed .full-status-text,
        .test-item.completed .full-status-text {
            background-color: transparent;
        }
        
        .test-item.closed .full-status-text {
            color: #dc3545; /* Đã đóng màu đỏ */
        }
        
        .test-item.completed .overlay-status {
            background-color: rgba(255, 255, 255, 0.9);
        }
        .test-item.completed .full-status-text {
             color: #28a745; /* Đã hoàn thành màu xanh lá */
             font-weight: bold;
             font-size: 1.2em;
        }
        /* --- KẾT THÚC CSS SỬA LỖI CHÍNH --- */


        .test-item .time {
            font-size: 0.9em;
            font-weight: normal;
            background-color: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
        }
        #loading { text-align: center; font-weight: bold; font-size: 1.1em; }
    </style>
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Chọn Đề Kiểm Tra</h1>
            <a href="home.html" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 69.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
                Quay lại
            </a>
        </div>

        <div class="welcome">
            Chào <strong id="studentName"></strong> (Lớp: <strong id="studentClass"></strong>),
            vui lòng chọn đề kiểm tra:
        </div>
        <div id="test-list">
            <div id="loading">Đang tải danh sách đề thi...</div>
        </div>
        <div id="no-test-message" style="text-align: center; margin-top: 20px; display: none;">
            <p style="font-size: 1.2em; color: #333;">🎉 Bạn đã hoàn thành tất cả các bài kiểm tra hiện có!</p>
            <p style="color: #6c757d;">Vui lòng chờ admin thêm đề mới hoặc xóa kết quả cũ để làm lại.</p>
        </div>
    </div>

    <script>
        // *** Dán firebaseConfig của bạn vào đây ***
        const firebaseConfig = {
          apiKey: "AIzaSyDmRq3djRZHElhC2T_EYsU7v5vrzwRyybY",
          authDomain: "webkiemtra-66cdc.firebaseapp.com",
          projectId: "webkiemtra-66cdc",
          storageBucket: "webkiemtra-66cdc.firebasestorage.app",
          messagingSenderId: "181113887829",
          appId: "1:181113887829:web:49535ee20d85b7395948dc"
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) { console.error("Lỗi cấu hình Firebase:", e); }
        
        const studentName = localStorage.getItem('studentName');
        const studentClass = localStorage.getItem('studentClass');

        if (!studentName || !studentClass) {
            window.location.href = 'index.html';
        }

        document.getElementById('studentName').innerText = studentName;
        document.getElementById('studentClass').innerText = studentClass;
        
        // Hàm định dạng ngày giờ (chỉ lấy giờ và ngày)
        function formatDateTime(date) {
            if (!date) return 'Không giới hạn';
            // Ví dụ: 10:30 20/11
            return `${date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} ${date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })}`;
        }


        // --- HÀM TẢI DANH SÁCH ĐỀ THI (ĐÃ SỬA LỖI HIỂN THỊ) ---
        async function loadTestList() {
            const listDiv = document.getElementById('test-list');
            const loadingDiv = document.getElementById('loading');
            const noTestMessage = document.getElementById('no-test-message');
            listDiv.innerHTML = '';
            loadingDiv.style.display = 'block';

            try {
                // Lấy thời gian hiện tại
                const currentTime = new Date();
                
                // 1. Tải danh sách TẤT CẢ đề thi có sẵn
                const testsSnapshot = await db.collection("dethi").get();
                const allTests = [];
                testsSnapshot.forEach(doc => {
                    allTests.push({ id: doc.id, data: doc.data() });
                });

                // 2. Tải danh sách BÀI ĐÃ NỘP của học sinh này
                const submissionsSnapshot = await db.collection("ketqua")
                    .where("hoTen", "==", studentName)
                    .where("lop", "==", studentClass)
                    .get();
                
                const completedTestIds = new Set();
                submissionsSnapshot.forEach(doc => {
                    const submission = doc.data();
                    completedTestIds.add(submission.deThiId);
                });

                loadingDiv.style.display = 'none';

                let availableTestsCount = 0;
                
                // 3. Lọc và hiển thị
                allTests.forEach(test => {
                    const testId = test.id;
                    const testName = test.data.tenDe;
                    const testTime = test.data.thoiGianLamBai || 15;
                    const isCompleted = completedTestIds.has(testId);
                    
                    let isDisabled = isCompleted;
                    let statusText = '';
                    let statusClass = '';

                    const startTime = test.data.thoiGianMo ? new Date(test.data.thoiGianMo) : null;
                    const endTime = test.data.thoiGianDong ? new Date(test.data.thoiGianDong) : null;
                    
                    if (startTime || endTime || isCompleted) {
                        
                        if (startTime && currentTime < startTime) {
                            isDisabled = true;
                            statusClass = 'disabled';
                            const startStr = startTime ? formatDateTime(startTime) : 'Không giới hạn';
                            const endStr = endTime ? formatDateTime(endTime) : 'Không giới hạn';
                            
                            statusText = `CHƯA MỞ (Bắt đầu: ${startStr} | Kết thúc: ${endStr})`;
                            
                        } else if (endTime && currentTime > endTime) {
                            isDisabled = true;
                            statusClass = 'disabled closed';
                            const endStr = endTime ? formatDateTime(endTime) : 'Không giới hạn';
                            statusText = `ĐÃ ĐÓNG (Kết thúc: ${endStr})`;
                            
                        } else if (isCompleted) {
                            isDisabled = true;
                            statusClass = 'disabled completed';
                            statusText = 'ĐÃ HOÀN THÀNH';
                        } else {
                            availableTestsCount++;
                        }
                    } else {
                         if (!isCompleted) {
                            availableTestsCount++;
                        } else {
                            isDisabled = true;
                            statusClass = 'disabled completed';
                            statusText = 'ĐÃ HOÀN THÀNH';
                        }
                    }
                    
                    const button = document.createElement('button');
                    button.className = `test-item ${statusClass}`;
                    
                    // Hiển thị trạng thái gộp nếu bị disabled
                    const overlayContent = isDisabled ? `
                        <div class="overlay-status">
                            <span class="full-status-text">${statusText}</span>
                        </div>
                    ` : '';


                    button.innerHTML = `
                        <div class="test-item-content">
                            <span>${testName}</span>
                            <span class="time">${testTime} phút</span>
                        </div>
                        ${overlayContent}
                    `;
                    
                    if (isDisabled) {
                        button.disabled = true;
                    } else {
                        button.onclick = () => {
                            localStorage.setItem('selectedTestId', testId);
                            localStorage.setItem('selectedTestName', testName);
                            localStorage.setItem('selectedTestTime', testTime); 
                            window.location.href = 'test.html';
                        };
                    }
                    
                    listDiv.appendChild(button);
                });

                // 4. Hiển thị thông báo nếu không còn bài nào để làm
                if (availableTestsCount === 0 && allTests.length > 0) {
                    noTestMessage.style.display = 'block';
                } else if (allTests.length === 0) {
                    listDiv.innerHTML = '<p>Chưa có đề thi nào được tạo bởi admin.</p>';
                }


            } catch (error) {
                console.error("Lỗi tải danh sách đề hoặc kết quả: ", error);
                loadingDiv.innerText = "Lỗi tải đề. Vui lòng kiểm tra Rules và Index trong Firestore.";
            }
        }
        
        loadTestList();
    </script>
</body>

</html>
