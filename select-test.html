<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Đề Kiểm Tra</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #6c757d;
            --secondary-hover: #5a6268;
            --light-bg: #f0f2f5;
            --white-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --border-radius: 8px; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--light-bg); 
            margin: 0; 
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 30px;
            background: var(--white-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        /* Nút chung */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            text-decoration: none;
            color: var(--white-bg);
            transition: background-color 0.2s;
        }
        .btn svg { width: 16px; height: 16px; fill: currentColor; }
        .btn-secondary { background-color: var(--secondary-color); }
        .btn-secondary:hover { background-color: var(--secondary-hover); }

        /* Header trang */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .page-header h1 { margin: 0; color: #333; }
        
        .welcome {
            font-size: 1.1em;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        /* Danh sách đề thi */
        #test-list {
            margin-top: 20px;
        }
        .test-item {
            display: block; 
            width: 100%;
            margin-bottom: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: left;
            transition: background-color 0.2s, transform 0.2s;
            box-sizing: border-box;
            position: relative; 
            padding: 0; 
            overflow: hidden;
        }
        
        /* Div nội dung để giữ padding và flex */
        .test-item-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px; 
            width: 100%;
            height: 100%;
            box-sizing: border-box; 
        }

        .test-item:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px);
        }
        .test-item.disabled { 
            background-color: #adb5bd;
            cursor: not-allowed;
            opacity: 1;
            transform: none;
        }
        
        .test-item .overlay-status {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 8px; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            flex-direction: column; 
            padding: 10px;
            box-sizing: border-box;
        }
        
        .full-status-text {
            max-width: 90%; 
            display: block;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1em; 
            font-weight: 600; 
            color: #ffc107;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0; 
            background-color: transparent;
        }

        @media (max-width: 400px) {
            .full-status-text {
                white-space: normal;
                word-break: break-word;
                font-size: 0.9em;
                max-width: 95%; 
            }
        }
        
        .test-item.disabled .full-status-text,
        .test-item.closed .full-status-text,
        .test-item.completed .full-status-text {
            background-color: transparent;
        }
        
        .test-item.closed .full-status-text {
            color: #dc3545;
        }
        
        .test-item.completed .overlay-status {
            background-color: rgba(255, 255, 255, 0.9);
        }
        .test-item.completed .full-status-text {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2em;
        }

        .test-item .time {
            font-size: 0.9em;
            font-weight: normal;
            background-color: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
        }
        .test-code-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.78em;
            font-weight: 700;
            margin-left: 6px;
            vertical-align: middle;
        }
        #loading { text-align: center; font-weight: bold; font-size: 1.1em; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Chọn Đề Kiểm Tra</h1>
            <a href="home.html" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 69.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
                Quay lại
            </a>
        </div>

        <div class="welcome">
            Chào <strong id="studentName"></strong> (Lớp: <strong id="studentClass"></strong>),
            vui lòng chọn đề kiểm tra:
        </div>
        <div id="subject-filter-bar" style="margin-bottom: 15px; display: none; align-items: center; gap: 10px; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; border: 1px solid #dee2e6;">
            <label for="subject-filter" style="font-weight: 600; color: #333; white-space: nowrap;">📚 Lọc theo Môn học:</label>
            <select id="subject-filter" style="flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #ced4da; font-size: 0.95em; background: #fff;">
                <option value="">-- Tất cả Môn học --</option>
            </select>
        </div>
        <div id="test-list">
            <div id="loading">Đang tải danh sách đề thi...</div>
        </div>
        <div id="no-test-message" style="text-align: center; margin-top: 20px; display: none;">
            <p style="font-size: 1.2em; color: #333;">🎉 Bạn đã hoàn thành tất cả các bài kiểm tra hiện có!</p>
            <p style="color: #6c757d;">Vui lòng chờ admin thêm đề mới hoặc xóa kết quả cũ để làm lại.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDmRq3djRZHElhC2T_EYsU7v5vrzwRyybY",
          authDomain: "webkiemtra-66cdc.firebaseapp.com",
          projectId: "webkiemtra-66cdc",
          storageBucket: "webkiemtra-66cdc.firebasestorage.app",
          messagingSenderId: "181113887829",
          appId: "1:181113887829:web:49535ee20d85b7395948dc"
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) { console.error("Lỗi cấu hình Firebase:", e); }
        
        const studentName = localStorage.getItem('studentName');
        const studentClass = localStorage.getItem('studentClass');

        if (!studentName || !studentClass) {
            window.location.href = 'index.html';
        }

        document.getElementById('studentName').innerText = studentName;
        document.getElementById('studentClass').innerText = studentClass;
        
        let allTestsData = [];
        let completedTestIdsData = new Set();
        let testListUpdateInterval = null;

        function escHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function getExamCode(test) {
            return String((test && (test.maDe ?? test.ma_de ?? test.maCode)) || '').trim();
        }
        function shouldShowExamCode(test, pool) {
            const code = getExamCode(test);
            if (!code) return false;
            const subj = (test.monHoc || '').trim().toLowerCase();
            if (!subj) return true;
            const sameSubjectTests = (pool || allTestsData).filter(t => (t.monHoc || '').trim().toLowerCase() === subj);
            return sameSubjectTests.length > 1;
        }
        function formatDateTime(date) {
            if (!date) return 'Không giới hạn';
            return `${date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} ${date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })}`;
        }

        async function loadTestList() {
            const listDiv = document.getElementById('test-list');
            const loadingDiv = document.getElementById('loading');
            const noTestMessage = document.getElementById('no-test-message');
            listDiv.innerHTML = '';
            loadingDiv.style.display = 'block';

            try {
                // 1. TẢI VÀ LỌC DANH SÁCH ĐỀ THEO LỚP
                const testsSnapshot = await db.collection("dethi").get();
                allTestsData = []; 
                
                testsSnapshot.forEach(doc => {
                    const testData = doc.data();
                    const lopApDung = (testData.lopApDung || '').trim().toLowerCase();
                    const myClass = (studentClass || '').trim().toLowerCase();
                    
                    let isAllowed = true;
                    if (lopApDung !== '') {
                        const allowedClasses = lopApDung.split(',').map(c => c.trim());
                        isAllowed = allowedClasses.includes(myClass);
                    }

                    if (isAllowed) {
                        allTestsData.push(Object.assign({ id: doc.id }, testData));
                    }
                });

                // 2. Tải danh sách BÀI ĐÃ NỘP của học sinh này
                completedTestIdsData.clear();
                const studentCode = localStorage.getItem('studentCode') || '';
                if (studentCode) {
                    const byCode = await db.collection("ketqua").where("maHS", "==", studentCode).get();
                    byCode.forEach(doc => completedTestIdsData.add(doc.data().deThiId));
                }
                const legacy = await db.collection("ketqua")
                    .where("hoTen", "==", studentName)
                    .where("lop", "==", studentClass)
                    .get();
                legacy.forEach(doc => {
                    const d = doc.data();
                    if (!d.maHS || !studentCode) completedTestIdsData.add(d.deThiId);
                });

                loadingDiv.style.display = 'none';

                // Xây dựng bộ lọc Môn học từ danh sách đề của lớp
                const subjectFilterBar = document.getElementById('subject-filter-bar');
                const subjectFilterSelect = document.getElementById('subject-filter');
                const subjects = new Set();
                allTestsData.forEach(t => {
                    if (t.monHoc && t.monHoc.trim()) {
                        subjects.add(t.monHoc.trim());
                    }
                });
                if (subjects.size > 0) {
                    subjectFilterBar.style.display = 'flex';
                    subjectFilterSelect.innerHTML = '<option value="">-- Tất cả Môn học --</option>';
                    [...subjects].sort().forEach(sub => {
                        const opt = document.createElement('option');
                        opt.value = sub;
                        opt.text = sub;
                        subjectFilterSelect.appendChild(opt);
                    });
                    subjectFilterSelect.onchange = () => renderFilteredTests();
                } else {
                    subjectFilterBar.style.display = 'none';
                }

                renderFilteredTests();

                if (testListUpdateInterval) clearInterval(testListUpdateInterval);
                testListUpdateInterval = setInterval(updateTestAvailability, 5000); 

            } catch (error) {
                console.error("Lỗi tải danh sách đề hoặc kết quả: ", error);
                loadingDiv.innerText = "Lỗi tải đề. Vui lòng kiểm tra Rules và Index trong Firestore.";
            }
        }

        function renderFilteredTests() {
            const listDiv = document.getElementById('test-list');
            const noTestMessage = document.getElementById('no-test-message');
            const subjectFilterVal = (document.getElementById('subject-filter')?.value || '').trim().toLowerCase();
            const currentTime = new Date();

            listDiv.innerHTML = '';
            noTestMessage.style.display = 'none';

            const filteredTests = allTestsData.filter(test => {
                if (!subjectFilterVal) return true;
                return (test.monHoc || '').trim().toLowerCase() === subjectFilterVal;
            });

            let availableTestsCount = 0;

            filteredTests.forEach(test => {
                const testId = test.id;
                const testName = test.tenDe; 
                const testTime = test.thoiGianLamBai || 15; 
                const examCode = getExamCode(test);
                const showExamCode = shouldShowExamCode(test, allTestsData);
                const isCompleted = completedTestIdsData.has(testId);
                
                let isDisabled = isCompleted;
                let statusText = '';
                let statusClass = '';

                const startTime = test.thoiGianMo ? new Date(test.thoiGianMo) : null; 
                const endTime = test.thoiGianDong ? new Date(test.thoiGianDong) : null; 
                
                if (startTime || endTime || isCompleted) {
                    if (startTime && currentTime < startTime) {
                        isDisabled = true;
                        statusClass = 'disabled';
                        const startStr = startTime ? formatDateTime(startTime) : 'Không giới hạn';
                        const endStr = endTime ? formatDateTime(endTime) : 'Không giới hạn';
                        statusText = `CHƯA MỞ (Bắt đầu: ${startStr} | Kết thúc: ${endStr})`;
                    } else if (endTime && currentTime > endTime) {
                        isDisabled = true;
                        statusClass = 'disabled closed';
                        const endStr = endTime ? formatDateTime(endTime) : 'Không giới hạn';
                        statusText = `ĐÃ ĐÓNG (Kết thúc: ${endStr})`;
                    } else if (isCompleted) {
                        isDisabled = true;
                        statusClass = 'disabled completed';
                        statusText = 'ĐÃ HOÀN THÀNH';
                    } else {
                        availableTestsCount++;
                    }
                } else {
                    if (!isCompleted) {
                        availableTestsCount++;
                    } else {
                        isDisabled = true;
                        statusClass = 'disabled completed';
                        statusText = 'ĐÃ HOÀN THÀNH';
                    }
                }
                
                const button = document.createElement('button');
                button.className = `test-item ${statusClass}`;
                button.dataset.testId = testId; 
                
                const overlayContent = isDisabled ? `
                    <div class="overlay-status">
                        <span class="full-status-text">${statusText}</span>
                    </div>
                ` : '';

                const subjectBadge = (test.monHoc && test.monHoc.trim())
                    ? `<span style="display:inline-block; background:rgba(255,255,255,0.22); padding:3px 9px; border-radius:12px; font-size:0.78em; margin-bottom:5px; font-weight:600;">📚 Môn: ${escHtml(test.monHoc.trim())}</span><br>`
                    : '';

                const codeBadge = showExamCode
                    ? `<span class="test-code-badge">Mã đề: ${escHtml(examCode)}</span>`
                    : '';

                button.innerHTML = `
                    <div class="test-item-content">
                        <div>
                            ${subjectBadge}
                            <span>${escHtml(testName)}</span>
                            ${codeBadge}
                        </div>
                        <span class="time">${testTime} phút</span>
                    </div>
                    ${overlayContent}
                `;
                
                if (isDisabled) {
                    button.disabled = true;
                } else {
                    button.onclick = () => {
                        localStorage.setItem('selectedTestId', testId);
                        localStorage.setItem('selectedTestName', testName);
                        localStorage.setItem('selectedTestTime', testTime);
                        localStorage.setItem('selectedTestSubject', test.monHoc || '');
                        localStorage.setItem('selectedTestCode', examCode);
                        window.location.href = 'rules.html'; 
                    };
                }
                
                listDiv.appendChild(button);
            });

            if (availableTestsCount === 0 && filteredTests.length > 0) {
                noTestMessage.style.display = 'block';
            } else if (filteredTests.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#6c757d;">Chưa có đề thi nào phù hợp.</p>';
            }
        }
        
        function updateTestAvailability() {
            const currentTime = new Date();
            const testItems = document.querySelectorAll('.test-item');

            testItems.forEach(button => {
                const testId = button.dataset.testId;
                if (!testId) return;

                const test = allTestsData.find(t => t.id === testId); 
                if (!test) return;

                const isCompleted = completedTestIdsData.has(testId);
                if (isCompleted) {
                    return; 
                }

                let isDisabled = false;
                let statusText = '';
                let statusClass = '';

                const startTime = test.thoiGianMo ? new Date(test.thoiGianMo) : null; 
                const endTime = test.thoiGianDong ? new Date(test.thoiGianDong) : null; 

                if (startTime && currentTime < startTime) {
                    isDisabled = true;
                    statusClass = 'disabled';
                    const startStr = startTime ? formatDateTime(startTime) : 'Không giới hạn';
                    const endStr = endTime ? formatDateTime(endTime) : 'Không giới hạn';
                    statusText = `CHƯA MỞ (Bắt đầu: ${startStr} | Kết thúc: ${endStr})`;
                } else if (endTime && currentTime > endTime) {
                    isDisabled = true;
                    statusClass = 'disabled closed';
                    const endStr = endTime ? formatDateTime(endTime) : 'Không giới hạn';
                    statusText = `ĐÃ ĐÓNG (Kết thúc: ${endStr})`;
                }
                
                const overlay = button.querySelector('.overlay-status');

                if (isDisabled) {
                    if (button.disabled === false) {
                        button.disabled = true;
                        button.className = `test-item ${statusClass}`;
                        
                        const overlayElement = document.createElement('div');
                        overlayElement.className = 'overlay-status';
                        overlayElement.innerHTML = `<span class="full-status-text">${statusText}</span>`;
                        button.appendChild(overlayElement);
                    } else {
                        if (overlay) {
                            overlay.querySelector('.full-status-text').innerText = statusText;
                        }
                    }
                } else {
                    if (button.disabled === true) {
                        button.disabled = false;
                        button.className = 'test-item';
                        
                        if (overlay) {
                            overlay.remove();
                        }
                        
                        const examCode = getExamCode(test);
                        button.onclick = (function(tId, tName, tTime, tSubject, tCode) { 
                            return function() {
                                localStorage.setItem('selectedTestId', tId);
                                localStorage.setItem('selectedTestName', tName);
                                localStorage.setItem('selectedTestTime', tTime); 
                                localStorage.setItem('selectedTestSubject', tSubject || '');
                                localStorage.setItem('selectedTestCode', tCode || '');
                                window.location.href = 'rules.html'; 
                            };
                        })(testId, test.tenDe, test.thoiGianLamBai || 15, test.monHoc, examCode); 
                    }
                }
            });
        }

        loadTestList();
    </script>
</body>
</html>
