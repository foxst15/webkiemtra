<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài kiểm tra</title>
    <style>
        /* CSS cơ bản giữ nguyên */
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:1.5rem;background-color:#f0f2f5; padding-top: 80px; /* Thêm padding top để tránh bị che */}
        .container{max-width:800px;margin:0 auto;background:#fff;padding:2rem;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
        h1{text-align:center;color:#333}
        #studentInfo{font-size:1.1em;font-weight:600;padding:1rem;background:#e9ecef;border-radius:8px;color:#333}
        .question{margin-bottom:2rem;border-bottom:1px solid #eee;padding-bottom:1.5rem}
        .question p{font-weight:600;font-size:1.1rem;margin-bottom:1rem}
        .options{margin-left:.5rem}
        .options label{display:block;margin-bottom:.75rem;font-size:1rem;cursor:pointer;padding:.75rem;border-radius:8px;transition:background-color .2s}
        .options label:hover{background-color:#f8f9fa}
        .options input[type=radio]{margin-right:.75rem}
        #submitBtn{background-color:#28a745;color:#fff;padding:.75rem 1.5rem;border:none;border-radius:8px;cursor:pointer;font-size:1.1rem;font-weight:600;margin-top:1rem;transition:background-color .2s}
        #submitBtn:hover{background-color:#218838}
        #submitBtn:disabled{background-color:#aaa;cursor:not-allowed}
        #loading { font-size: 1.2em; text-align: center; font-weight: bold; }

        /* CSS CHO THANH THỜI GIAN */
        #timer-bar {
            position: fixed; /* Giữ cố định trên màn hình */
            top: 0;
            left: 0;
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #timer-bar.warning { background-color: #dc3545; } /* Đổi màu khi sắp hết giờ */

        /* *** MỚI: Tương thích điện thoại (Responsive) *** */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
                padding-top: 80px; /* Vẫn giữ padding cho timer bar */
            }
            .container {
                padding: 1.5rem;
                margin-top: 0;
            }
            .options label {
                padding: 1rem; /* Tăng vùng nhấn cho dễ bấm */
            }
            h1 { font-size: 1.5em; }
        }
    </style>
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- THANH THỜI GIAN -->
    <div id="timer-bar">
        Thời gian: <span id="timer">--:--</span>
    </div>

    <div class="container">
        <h1 id="testTitle">Bài kiểm tra</h1>
        <div id="studentInfo"></div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 2rem 0;">

        <div id="loading">Đang tải đề thi, vui lòng chờ...</div>
        <form id="testForm"></form>
        <button id="submitBtn" onclick="submitTest()" style="display: none;">Nộp bài</button>
    </div>

    <script>
        // *** ĐÃ DÁN firebaseConfig CỦA BẠN ***
        const firebaseConfig = {
          apiKey: "AIzaSyDmRq3djRZHElhC2T_EYsU7v5vrzwRyybY",
          authDomain: "webkiemtra-66cdc.firebaseapp.com",
          projectId: "webkiemtra-66cdc",
          storageBucket: "webkiemtra-66cdc.firebasestorage.app",
          messagingSenderId: "181113887829",
          appId: "1:181113887829:web:49535ee20d85b7395948dc"
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) { alert("Lỗi cấu hình Firebase!"); }

        // --- Lấy thông tin ---
        const studentName = localStorage.getItem('studentName');
        const studentClass = localStorage.getItem('studentClass');
        const selectedTestId = localStorage.getItem('selectedTestId');
        const selectedTestName = localStorage.getItem('selectedTestName');
        
        const testTimeMinutes = parseInt(localStorage.getItem('selectedTestTime') || 15, 10);

        if (!studentName || !studentClass) window.location.href = 'index.html';
        if (!selectedTestId) window.location.href = 'select-test.html';

        document.getElementById('studentInfo').innerText = `Thí sinh: ${studentName} - Lớp: ${studentClass}`;
        document.getElementById('testTitle').innerText = selectedTestName || "Bài kiểm tra";

        // --- Biến toàn cục ---
        let correctAnswers = []; 
        let timerInterval = null; 
        let daNopBai = false; 
        let leaveTimeout = null; 
        let visibilityTimeout = null; // *** MỚI: Biến đếm thời gian chuyển tab ***

        // --- TẢI CÂU HỎI ---
        async function loadQuiz() {
            const testForm = document.getElementById('testForm');
            const loadingDiv = document.getElementById('loading');
            const submitButton = document.getElementById('submitBtn');
            try {
                const snapshot = await db.collection("dethi").doc(selectedTestId).collection("cauhoi").get();
                if (snapshot.empty) {
                    loadingDiv.innerText = "Lỗi: Đề thi này chưa có câu hỏi.";
                    return;
                }
                let questionIndex = 0;
                snapshot.forEach(doc => {
                    const q = doc.data();
                    correctAnswers.push(q.answer); 
                    // (Code hiển thị câu hỏi)
                    let questionDiv = document.createElement('div');
                    questionDiv.className = 'question';
                    let promptP = document.createElement('p');
                    promptP.innerText = `${questionIndex + 1}. ${q.prompt}`;
                    questionDiv.appendChild(promptP);
                    let optionsDiv = document.createElement('div');
                    optionsDiv.className = 'options';
                    q.options.forEach(option => {
                        let label = document.createElement('label');
                        let input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `question${questionIndex}`;
                        input.value = option;
                        label.appendChild(input);
                        label.append(` ${option}`);
                        optionsDiv.appendChild(label);
                    });
                    questionDiv.appendChild(optionsDiv);
                    testForm.appendChild(questionDiv);
                    questionIndex++;
                });

                loadingDiv.style.display = 'none';
                submitButton.style.display = 'block';
                
                startTimer(testTimeMinutes * 60); 

                // *** CẬP NHẬT: Kích hoạt tính năng chống gian lận ***
                setupAntiCheat();

            } catch (error) {
                console.error("Lỗi khi tải câu hỏi: ", error);
            }
        }
        
        // --- HÀM ĐẾM NGƯỢC ---
        function startTimer(durationInSeconds) {
            let timeLeft = durationInSeconds;
            const timerElement = document.getElementById('timer');
            const timerBarElement = document.getElementById('timer-bar');

            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.innerText = "HẾT GIỜ";
                    timerBarElement.classList.add('warning');
                    autoSubmit();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    
                    minutes = minutes < 10 ? '0' + minutes : minutes;
                    seconds = seconds < 10 ? '0' + seconds : seconds;
                    
                    timerElement.innerText = `${minutes}:${seconds}`;
                    
                    if (timeLeft <= 60) {
                        timerBarElement.classList.add('warning');
                    }
                }
            }, 1000);
        }

        // --- HÀM TỰ ĐỘNG NỘP BÀI (Hết giờ) ---
        function autoSubmit() {
            if (daNopBai) return; 
            alert("Đã hết giờ làm bài! Bài của bạn sẽ được nộp tự động.");
            submitTest(true, "Hết giờ"); 
        }

        // --- *** HÀM CẬP NHẬT: Chống Gian Lận (Đa nền tảng) *** ---
        function setupAntiCheat() {
            // 1. Chống gian lận cho Desktop (Đưa chuột ra ngoài)
            document.documentElement.addEventListener('mouseleave', () => {
                if (daNopBai) return; 
                leaveTimeout = setTimeout(() => {
                    if (daNopBai) return; 
                    alert("Bạn bị nộp bài tự động vì đã rời khỏi trang quá 10 giây!");
                    submitTest(true, "Rời khỏi trang (Desktop)");
                }, 10000); // 10 giây
            });

            document.documentElement.addEventListener('mouseenter', () => {
                // Quay lại, huỷ nộp bài
                if (leaveTimeout) {
                    clearTimeout(leaveTimeout);
                    leaveTimeout = null;
                }
            });

            // 2. Chống gian lận cho Mobile & Desktop (Chuyển Tab/Ứng dụng)
            // Sử dụng Page Visibility API
            document.addEventListener('visibilitychange', () => {
                if (daNopBai) return;

                if (document.hidden) {
                    // Người dùng vừa chuyển tab/ứng dụng
                    visibilityTimeout = setTimeout(() => {
                        if (daNopBai) return;
                        alert("Bạn bị nộp bài tự động vì đã chuyển tab/ứng dụng quá 10 giây!");
                        submitTest(true, "Chuyển tab/ứng dụng");
                    }, 10000); // 10 giây
                } else {
                    // Người dùng vừa quay lại
                    if (visibilityTimeout) {
                        clearTimeout(visibilityTimeout);
                        visibilityTimeout = null;
                    }
                }
            });
        }


        // --- HÀM NỘP BÀI (Cập nhật) ---
        async function submitTest(isAutoSubmit = false, autoSubmitReason = null) {
            if (daNopBai) return; 

            // Hỏi xác nhận nếu là nộp thủ công
            if (!isAutoSubmit) {
                if (!confirm("Bạn có chắc chắn muốn nộp bài không?")) {
                    return; 
                }
            }
            
            daNopBai = true; // Đánh dấu đã nộp
            clearInterval(timerInterval); // Dừng đồng hồ
            // *** CẬP NHẬT: Dừng tất cả các bộ đếm giờ gian lận ***
            if (leaveTimeout) clearTimeout(leaveTimeout); 
            if (visibilityTimeout) clearTimeout(visibilityTimeout);

            const submitButton = document.getElementById('submitBtn');
            submitButton.disabled = true;
            submitButton.innerText = "Đang nộp bài...";
            
            // (Phần chấm điểm)
            let score = 0;
            const form = document.getElementById('testForm');
            correctAnswers.forEach((answer, index) => {
                const selected = form.querySelector(`input[name="question${index}"]:checked`);
                if (selected && selected.value === answer) {
                    score++;
                }
            });
            const totalQuestions = correctAnswers.length;
            const finalScore = (score / totalQuestions) * 10;
            
            // Lưu vào localStorage
            localStorage.setItem('score', finalScore.toFixed(2));
            localStorage.setItem('totalQuestions', totalQuestions);
            localStorage.setItem('correctCount', score);

            // Lưu kết quả lên Firebase
            if (db) {
                try {
                    await db.collection("ketqua").add({
                        hoTen: studentName,
                        lop: studentClass,
                        diemSo: finalScore.toFixed(2),
                        soCauDung: score,
                        tongSoCau: totalQuestions,
                        deThiId: selectedTestId,
                        tenDeThi: selectedTestName,
                        thoiGianNop: firebase.firestore.FieldValue.serverTimestamp(),
                        // *** CẬP NHẬT: Lưu lý do nộp tự động ***
                        nopTuDong: isAutoSubmit, 
                        lyDoNopTuDong: autoSubmitReason 
                    });
                } catch (error) {
                    console.error("Lỗi khi lưu kết quả: ", error);
                }
            }
            
            // Chuyển sang trang kết quả
            window.location.href = 'results.html';
        }

        // --- KHỞI ĐỘNG ---
        loadQuiz(); 
    </script>
</body>
</html>
