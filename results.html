<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Kiểm Tra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --secondary-color: #6c757d;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --border-radius: 12px;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        /* Tiêu đề */
        h1 { 
            color: var(--primary-color); 
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .test-subtitle {
            color: var(--secondary-color);
            font-size: 1.1em;
            margin-bottom: 25px;
        }

        /* Hộp Điểm Số */
        .score-box { 
            background-color: #e9ecef; 
            padding: 30px 20px; 
            border-radius: var(--border-radius); 
            margin: 20px 0;
            border: 2px solid #ced4da;
            transition: transform 0.2s;
        }
        .score-label {
            font-size: 1.1em;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .score-value { 
            font-size: 4em; 
            font-weight: 800; 
            color: var(--primary-color); 
            line-height: 1.1;
            margin: 10px 0;
        }
        .score-pass { color: var(--success-color); }
        .score-fail { color: var(--danger-color); }

        /* Chi tiết */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
            text-align: center;
        }
        .stat-item {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9em;
            color: var(--secondary-color);
        }
        
        /* Thông báo nộp tự động */
        #auto-submit-notice {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
            display: none;
            text-align: left;
        }
        #auto-submit-notice.cheat {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        /* Nút bấm */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-home { background-color: var(--primary-color); }
        .btn-home:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-history { background-color: var(--success-color); }
        .btn-history:hover { background-color: #218838; transform: translateY(-2px); }

        /* *** MEDIA QUERIES (RESPONSIVE) *** */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; margin: 10px auto; }
            h1 { font-size: 1.6em; }
            .score-value { font-size: 3em; }
            .stats-grid { grid-template-columns: 1fr; gap: 10px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; box-sizing: border-box; }
        }
        .katex { font-size: 1.05em; }
        
        /* Chi tiết câu hỏi (nếu cần hiển thị) */
        #review-section {
            margin-top: 35px;
            text-align: left;
            border-top: 2px solid var(--border-color);
            padding-top: 25px;
            display: none;
        }
        #review-section h2 {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 20px;
        }
        .review-item {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }
        .review-q {
            font-weight: bold;
            color: #212529;
            margin-bottom: 10px;
            font-size: 1.05em;
        }
        .review-ans {
            font-size: 0.95em;
            margin: 5px 0;
        }
        .correct-text { color: var(--success-color); font-weight: 600; }
        .wrong-text { color: var(--danger-color); font-weight: 600; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            margin-left: 10px;
        }
        .badge-correct { background-color: var(--success-color); }
        .badge-wrong { background-color: var(--danger-color); }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎉 KẾT QUẢ BÀI KIỂM TRA</h1>
        <div class="test-subtitle" id="test-info">Đang tải thông tin...</div>

        <div id="auto-submit-notice"></div>

        <div class="score-box">
            <div class="score-label">Điểm số của bạn</div>
            <div class="score-value" id="score-display">--</div>
            <div id="student-name-display" style="font-size: 1.1em; color: #333; margin-top: 10px;"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="correct-count-display">0 / 0</div>
                <div class="stat-label">Số câu đúng</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="answered-count-display">0</div>
                <div class="stat-label">Số câu đã làm</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="status-display">Hoàn thành</div>
                <div class="stat-label">Trạng thái</div>
            </div>
        </div>

        <div class="btn-group">
            <a href="my-results.html" class="btn btn-history">📋 Xem Lịch Sử Làm Bài</a>
            <a href="home.html" class="btn btn-home">🏠 Về Trang Chủ</a>
        </div>

        <div id="review-section">
            <h2>📝 Chi tiết bài làm</h2>
            <div id="review-list"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDmRq3djRZHElhC2T_EYsU7v5vrzwRyybY",
          authDomain: "webkiemtra-66cdc.firebaseapp.com",
          projectId: "webkiemtra-66cdc",
          storageBucket: "webkiemtra-66cdc.firebasestorage.app",
          messagingSenderId: "181113887829",
          appId: "1:181113887829:web:49535ee20d85b7395948dc"
        };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) { console.error("Lỗi cấu hình Firebase:", e); }

        const studentName = localStorage.getItem('studentName');
        const studentClass = localStorage.getItem('studentClass');
        const testName = localStorage.getItem('selectedTestName');
        const testCode = localStorage.getItem('selectedTestCode') || '';
        const score = localStorage.getItem('score');
        const totalQuestions = localStorage.getItem('totalQuestions');
        const correctCount = localStorage.getItem('correctCount');
        const answeredCount = localStorage.getItem('answeredCount');
        const isAutoSubmit = localStorage.getItem('isAutoSubmit') === 'true';
        const submitReason = localStorage.getItem('submitReason') || 'Tự động';
        const lastSubmissionId = localStorage.getItem('lastSubmissionId');

        function escHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function renderMathInContainer(el) {
            if (!el || typeof renderMathInElement !== 'function') return;
            renderMathInElement(el, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false }
                ],
                throwOnError: false
            });
        }

        if (!studentName || score === null) {
            window.location.href = 'home.html';
        }

        const codePart = testCode ? ` — Mã đề: <strong>${escHtml(testCode)}</strong>` : '';
        document.getElementById('test-info').innerHTML = `Đề thi: <strong>${escHtml(testName || 'Bài kiểm tra')}</strong>${codePart}`;
        document.getElementById('student-name-display').innerHTML = `Thí sinh: <strong>${escHtml(studentName)}</strong> - Lớp: <strong>${escHtml(studentClass)}</strong>`;

        const scoreEl = document.getElementById('score-display');
        const numericScore = parseFloat(score);
        scoreEl.innerText = numericScore.toFixed(2);
        
        if (numericScore >= 5) {
            scoreEl.classList.add('score-pass');
        } else {
            scoreEl.classList.add('score-fail');
        }

        document.getElementById('correct-count-display').innerText = `${correctCount} / ${totalQuestions}`;
        document.getElementById('answered-count-display').innerText = answeredCount;

        const noticeEl = document.getElementById('auto-submit-notice');
        const statusEl = document.getElementById('status-display');

        if (isAutoSubmit) {
            noticeEl.style.display = 'block';
            if (submitReason.includes("gian lận")) {
                noticeEl.classList.add('cheat');
                noticeEl.innerHTML = `⚠️ <strong>Bài làm đã bị thu tự động!</strong> Lý do: <strong>${escHtml(submitReason)}</strong>.`;
                statusEl.innerText = "Vi phạm";
                statusEl.style.color = "var(--danger-color)";
            } else {
                noticeEl.innerHTML = `⏰ <strong>Hết thời gian làm bài!</strong> Hệ thống đã tự động nộp bài làm của bạn.`;
                statusEl.innerText = "Hết giờ";
                statusEl.style.color = "#856404";
            }
        }

        async function loadDetailedReview() {
            const reviewSection = document.getElementById('review-section');
            const reviewList = document.getElementById('review-list');
            
            let details = null;

            if (lastSubmissionId) {
                try {
                    const doc = await db.collection("ketqua").doc(lastSubmissionId).get();
                    if (doc.exists && doc.data().chiTietBaiLam) {
                        details = doc.data().chiTietBaiLam;
                    }
                } catch (e) {
                    console.error("Không thể tải chi tiết từ CSDL:", e);
                }
            }

            if (!details) {
                const pendingRaw = localStorage.getItem('pendingSubmission');
                if (pendingRaw) {
                    try {
                        const pendingObj = JSON.parse(pendingRaw);
                        if (pendingObj && Array.isArray(pendingObj.chiTietBaiLam)) {
                            details = pendingObj.chiTietBaiLam;
                        }
                    } catch (e) {
                        console.error("Không thể đọc dữ liệu chi tiết tạm:", e);
                    }
                }
            }

            if (details && details.length > 0) {
                reviewSection.style.display = 'block';
                reviewList.innerHTML = '';

                details.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'review-item';

                    const badge = item.dungHaySai 
                        ? '<span class="badge badge-correct">Đúng</span>' 
                        : '<span class="badge badge-wrong">Sai</span>';

                    const userAnsClass = item.dungHaySai ? 'correct-text' : 'wrong-text';

                    div.innerHTML = `
                        <div class="review-q">Câu ${index + 1}: ${escHtml(item.cauHoi)} ${badge}</div>
                        <div class="review-ans">Bạn chọn: <span class="${userAnsClass}">${escHtml(item.luaChonCuaHS || 'Chưa trả lời')}</span></div>
                        <div class="review-ans">Đáp án đúng: <span class="correct-text">${escHtml(item.dapAnDung)}</span></div>
                    `;
                    reviewList.appendChild(div);
                });

                renderMathInContainer(reviewList);
            }
        }

        loadDetailedReview();
    </script>
</body>
</html>
